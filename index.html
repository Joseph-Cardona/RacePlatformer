<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Race Platformer</title>
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.5.0/dist/pixi.min.js"></script>
  <style>
    body { margin:0; background:#000; overflow:hidden; font-family: Arial, sans-serif; }
    canvas { display:block; }
    #ui { position: absolute; top: 10px; left: 10px; color: white; z-index: 100; font-size: 20px; pointer-events: none; }
  </style>
</head>
<body>
  <div id="ui"></div>

  <script>
    const app = new PIXI.Application();
    let player, velocityX = 0, velocityY = 0, isOnGround = false;
    let platforms = [];
    let goal;
    let timer = 0;
    let gameRunning = false;
    let keys = {};
    let uiElement;
    let cameraX = 0;
    let deaths = 0;
    let isJumping = false; // For variable jump height

    const startX = 80;
    const startY = 350;

    async function init() {
      await app.init({
        background: '#0a0a2a',
        resizeTo: window,
        antialias: true
      });
      
      document.body.appendChild(app.canvas);
      uiElement = document.getElementById('ui');
      
      window.addEventListener('keydown', e => keys[e.key] = true);
      window.addEventListener('keyup', e => keys[e.key] = false);
      
      showStartScreen();
      app.ticker.add(gameLoop);
    }

    function showStartScreen() {
      app.stage.removeChildren();
      const title = new PIXI.Text({ text: 'RACE PLATFORMER', style: { fontSize: 72, fill: 0xffffff, fontWeight: 'bold' }});
      title.anchor.set(0.5); title.x = app.screen.width / 2; title.y = app.screen.height / 3;
      
      const startText = new PIXI.Text({ text: 'CLICK OR PRESS SPACE TO START', style: { fontSize: 36, fill: 0x00ffff }});
      startText.anchor.set(0.5); startText.x = app.screen.width / 2; startText.y = app.screen.height / 2;
      
      app.stage.addChild(title, startText);

      const startHandler = () => startGameLevel();
      app.canvas.addEventListener('pointerdown', startHandler, { once: true });
      window.addEventListener('keydown', e => { if (e.code === 'Space') startHandler(); }, { once: true });
    }

    function startGameLevel() {
      gameRunning = true;
      timer = 0;
      deaths = 0;
      velocityX = velocityY = 0;
      cameraX = 0;
      isJumping = false;
      platforms = [];

      app.stage.removeChildren();

      const bg = new PIXI.Graphics().rect(0, 0, 3000, app.screen.height).fill(0x112244);
      app.stage.addChild(bg);

      function addPlatform(x, y, w, h) {
        const p = new PIXI.Graphics().rect(0, 0, w, h).fill(0x00bb44);
        p.x = x; p.y = y;
        app.stage.addChild(p);
        platforms.push(p);
      }

      addPlatform(100, 450, 300, 20);
      addPlatform(500, 350, 200, 20);
      addPlatform(850, 480, 250, 20);
      addPlatform(1250, 280, 180, 20);
      addPlatform(1600, 420, 220, 20);
      addPlatform(1950, 220, 150, 20);
      addPlatform(2250, 380, 350, 20);

      player = new PIXI.Graphics();
      player.roundRect(0, 0, 40, 40, 8);
      player.fill(0x111111);
      player.stroke({ width: 4, color: 0x222222 });
      player.x = startX;
      player.y = startY;
      app.stage.addChild(player);

      goal = new PIXI.Graphics().rect(0, 0, 30, 120).fill(0x00ff88);
      goal.x = 2550; goal.y = 280;
      app.stage.addChild(goal);
    }

    function die() {
      deaths++;
      player.x = startX;
      player.y = startY;
      velocityX = 0;
      velocityY = 0;
      isJumping = false;
      cameraX = 0;
    }

    function gameLoop() {
      if (!gameRunning || !player) return;

      timer += 1/60;
      uiElement.textContent = `Time: ${timer.toFixed(1)}s | Deaths: ${deaths}`;

      const MOVE_SPEED = 11.5;
      const ACCEL = 2.0;
      const FRICTION = 0.78;
      const AIR_FRICTION = 0.94;
      const JUMP_FORCE = -19.5;
      const GRAVITY = 1.25;
      const TERMINAL_VELOCITY = 22;
      const JUMP_CUT = 0.55; // How much to cut the jump when releasing early

      // Horizontal movement
      let targetSpeed = 0;
      if (keys['ArrowLeft'] || keys['a'] || keys['A']) targetSpeed = -MOVE_SPEED;
      if (keys['ArrowRight'] || keys['d'] || keys['D']) targetSpeed = MOVE_SPEED;

      velocityX += (targetSpeed - velocityX) * ACCEL;
      velocityX *= (isOnGround ? FRICTION : AIR_FRICTION);
      player.x += velocityX;

      // Horizontal collisions
      for (let p of platforms) {
        if (player.x + 40 > p.x && player.x < p.x + p.width &&
            player.y + 40 > p.y && player.y < p.y + p.height) {
          if (velocityX > 0) player.x = p.x - 40;
          if (velocityX < 0) player.x = p.x + p.width;
          velocityX = 0;
        }
      }

      // Vertical movement
      velocityY += GRAVITY;
      if (velocityY > TERMINAL_VELOCITY) velocityY = TERMINAL_VELOCITY;
      player.y += velocityY;

      // Variable Jump Height - Cut upward velocity when jump button is released
      if (!keys[' '] && !keys['ArrowUp'] && !keys['w'] && !keys['W'] && velocityY < 0) {
        velocityY *= JUMP_CUT;
      }

      // Vertical collisions
      isOnGround = false;
      for (let p of platforms) {
        if (player.x + 40 > p.x && player.x < p.x + p.width &&
            player.y + 40 > p.y && player.y < p.y + p.height) {

          if (velocityY > 0) {
            player.y = p.y - 40;
            velocityY = 0;
            isOnGround = true;
            isJumping = false;
          } else if (velocityY < 0) {
            player.y = p.y + p.height;
            velocityY = 0;
          }
        }
      }

      // Fall death
      if (player.y > 650) {
        die();
        return;
      }

      // Jump (only when on ground)
      if ((keys[' '] || keys['ArrowUp'] || keys['w'] || keys['W']) && isOnGround) {
        velocityY = JUMP_FORCE;
        isOnGround = false;
        isJumping = true;
      }

      // Anti-jitter
      player.x = Math.round(player.x);
      player.y = Math.round(player.y);

      // Smooth camera
      const targetCam = -player.x + app.screen.width / 3;
      cameraX = cameraX * 0.85 + targetCam * 0.15;
      app.stage.x = Math.round(Math.max(Math.min(cameraX, 0), -2400));

      // Win
      if (player.x > 2520) {
        gameRunning = false;
        alert(`🎉 Level Complete!\nTime: ${timer.toFixed(1)} seconds\nDeaths: ${deaths}`);
        showStartScreen();
      }
    }

    init().catch(console.error);
  </script>
</body>
</html>
